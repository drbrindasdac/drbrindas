name: Refresh Google reviews

on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday, 03:00 UTC
  workflow_dispatch:       # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch reviews
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python3 scripts/fetch_reviews.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/reviews.json index.html
          git diff --staged --quiet || git commit -m "chore: refresh Google reviews"
          git push
